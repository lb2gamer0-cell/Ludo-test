name: Keep Render Backend Alive

# FIX: external, independent backup for the in-process self-ping worker in
# backend/Server.js. This runs OUTSIDE Render, so it also wakes the service
# back up if it ever fully spins down before the internal pinger gets a
# chance to fire (e.g. right after a deploy, or if the process restarted).
#
# GitHub's schedule can be delayed by a few minutes under load, so this is
# intentionally set to run every 10 minutes (well inside Render's 15-minute
# free-tier spin-down window) rather than relying on exact timing.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend endpoint
        run: |
          echo "Pinging Render server..."
          # Pehle /ping ko check karega, agar 404 ya fail hua toh base URL ko wake karega
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://ludo-game-cojp.onrender.com/ping" || echo "000")
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Ping route returned $HTTP_STATUS, waking base URL directly..."
            curl -s -o /dev/null -w "Base URL HTTP: %{http_code}\n" --max-time 45 "https://ludo-game-cojp.onrender.com" || true
          else
            echo "Server is awake and healthy (HTTP 200)!"
          fi

